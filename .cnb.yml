# .cnb.yml —— CNB 云原生构建配置；GitHub Actions 入口位于 .github/workflows/
#
# 三条流水线，与 CLAUDE.md 铁律 6 一一对应：
#   · main 的 push        → 检查：check / test / 全量 build 空跑，通过后移动 last-green
#   · web_trigger_check   → 同一套检查的手动入口（原 workflow_dispatch 的等价物）
#   · web_trigger_release → 发布：ingest → build → 核对 → 上传 → 部署 → 启用 → STATUS → 搜索推送
#   · web_trigger_archive → 归档：打 archive/<分支> tag、核对，然后才删分支
#
# 发布与部署只能手动（web_trigger），不许 push 触发，不许 crontab。
# `pnpm run check` 的第 4 节会解析本文件，把这两条变成硬拦截（铁律 6）。
#
# 凭据只从密钥仓库来（铁律 7），文件地址由手动发布参数提供，不绑定特定组织或仓库：
#   publish_secrets_url —— 对象存储写凭据（verify:manifest / publish:r2 / status），必填
#   deploy_secrets_url  —— 站点部署凭据（cloudflare / edgeone / github / workers / esa），选择部署目标时必填
# 检查与归档不导入外部密钥；失败信息保留在构建日志中。
# SEO 不需要密钥文件：只走 IndexNow，key 按协议公开在 site.config.yaml 的 seo.indexnow_key。
# 密钥都由**脚本任务**读取，所以文件里不能写 allow_images（平台规则：写了就只能被
# 插件任务引用，脚本任务读到的是空变量）。收紧改用 allow_slugs + allow_branches。
# 引用是逐字匹配的：路径差一个字，准备阶段就报 GetFileContent: not found。

.sync-authors: &sync-authors
  name: 检查并同步 AUTHORS（基于哈希比较，默认停用）
  image: python:3.12-bookworm
  if: '[ "${ENABLE_AUTHORS_SYNC:-false}" = "true" ]'
  script: |
    set -eu
    python3 - cnb <<'PY'
      import hashlib
      import json
      import os
      import re
      import subprocess
      import sys
      from pathlib import Path

      PLATFORM = sys.argv[1] if len(sys.argv) > 1 else "github"

      BOT_NAMES = {
          "github-actions[bot]",
          "dependabot[bot]",
          "renovate[bot]",
          "gitorange",
          "web-flow",
          "cn-patch 流水线",
          "magiacn autobot",
      }

      GH_NOREPLY_RE = re.compile(
          r"^(?:(\d+)\+)?([A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)@users\.noreply\.github\.com$",
          re.I,
      )
      TRAILER_RE = re.compile(r"^\s*([^<>]+?)\s*<([^<>@\s]+@[^<>\s]+)>\s*$")
      ROLE_ORDER = ("Committer", "Author", "Co-authored-by")
      CONSENT_YES = "[附加条款：已明确同意]"
      CONSENT_NO = "[附加条款：未明确同意]"


      def is_cnb_noreply(domain: str) -> bool:
          parts = domain.lower().split(".")
          return len(parts) >= 3 and parts[0] == "noreply" and parts[1] == "cnb"


      def extract_cnb_user(email: str) -> str | None:
          if "@" not in email:
              return None
          local, domain = email.rsplit("@", 1)
          if not is_cnb_noreply(domain):
              return None
          return local.split("+", 1)[1] if "+" in local else local


      def is_excluded_bot(name: str, email: str) -> bool:
          nl = name.strip().lower()
          el = email.strip().lower()
          local, _, domain = el.partition("@")
          if nl in BOT_NAMES:
              return True
          if nl.endswith("[bot]") or el.endswith("[bot]@users.noreply.github.com"):
              return True
          if nl == "cnb" and "local" in el:
              return True
          if local == "actions" and domain.startswith("github."):
              return True
          if local == "noreply" and ("gitorange" in domain or "web-flow." in domain):
              return True
          return False


      def classify_agent(name: str, email: str) -> tuple[str, str, str | None] | None:
          nl = name.strip().lower()
          el = email.strip().lower()
          domain = el.rsplit("@", 1)[1] if "@" in el else ""
          if "gemini-code-assist" in nl or "gemini-code-assist" in el:
              return (
                  "gemini-code-assist",
                  "200291788+gemini-code-assist@users.noreply.github.com",
                  "https://github.com/apps/gemini-code-assist",
              )
          if "claude" in nl or domain.startswith("anthropic."):
              return ("Claude", "noreply@anthropic.com", None)
          if "codex" in nl or domain.startswith("openai."):
              return ("Codex", "noreply@openai.com", None)
          if "antigravity" in nl:
              return ("Antigravity", "noreply@google.com", None)
          if "gemini" in nl:
              return ("Gemini", "noreply@google.com", None)
          if "kimi" in nl or domain.startswith("moonshot.") or domain.startswith("kimi."):
              return ("Kimi", "noreply@moonshot.cn", None)
          if "deepseek" in nl or domain.startswith("deepseek."):
              return ("DeepSeek", "noreply@deepseek.com", None)
          if "codebuddy" in nl or domain.startswith("codebuddy."):
              return ("CodeBuddy", "noreply@" + "codebuddy" + ".ai", None)
          return None


      def resolve_cnb_base() -> str:
          env_url = os.environ.get("CNB_WEB_ENDPOINT", "").strip()
          if env_url:
              return env_url.rstrip("/")
          res = subprocess.run(
              ["git", "remote", "get-url", "origin"],
              capture_output=True,
              text=True,
          )
          m = re.match(r"^(https?://[^/]+)", res.stdout.strip())
          return m.group(1) if m else ""


      def human_identity(name: str, email: str, cnb_base: str) -> tuple[str, str | None]:
          m_gh = GH_NOREPLY_RE.match(email.strip())
          if m_gh:
              user = m_gh.group(2)
              return (f"gh:{user.lower()}", f"https://github.com/{user}")
          cnb_user = extract_cnb_user(email.strip())
          if cnb_user:
              if PLATFORM == "cnb":
                  link = f"{cnb_base}/u/{cnb_user}" if cnb_base else None
                  return (f"cnb:{cnb_user.lower()}", link)
              if cnb_user.lower() == "cybernova":
                  return ("gh:cybernova2333", "https://github.com/CyberNova2333")
              return (f"cnb:{cnb_user.lower()}", None)
          nl = re.sub(r"\s+", " ", name.strip()).lower()
          if nl == "cybernova":
              return ("gh:cybernova2333", "https://github.com/CyberNova2333")
          if nl.startswith("cmliu"):
              return ("gh:cmliu", "https://github.com/cmliu")
          return (f"name:{nl}", None)


      def email_sort_key(email: str) -> tuple[int, str]:
          el = email.lower()
          m = GH_NOREPLY_RE.match(el)
          if m:
              return (0 if m.group(1) else 1, el)
          if extract_cnb_user(el):
              return (2, el)
          return (3, el)


      def name_sort_key(name: str) -> tuple[int, int, str]:
          has_upper = any(c.isupper() for c in name)
          return (0 if has_upper else 1, -len(name), name.lower())


      def load_consent_map() -> dict[str, bool]:
          meta_path = Path("meta.json")
          if not meta_path.is_file():
              return {}
          try:
              data = json.loads(meta_path.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              return {}
          if not isinstance(data, dict):
              return {}
          raw = data.get("additionalTermsConsent")
          if not isinstance(raw, dict):
              return {}
          consent_map: dict[str, bool] = {}
          for k, v in raw.items():
              if isinstance(v, bool):
                  norm_k = re.sub(r"\s+", " ", str(k).strip()).lower()
                  if norm_k:
                      consent_map[norm_k] = v
          return consent_map


      def resolve_human_consent(ent: dict, consent_map: dict[str, bool]) -> bool:
          if not consent_map:
              return False
          candidates: list[str] = []
          for email in sorted(ent["emails"], key=email_sort_key):
              el = email.strip().lower()
              candidates.append(el)
              m_gh = GH_NOREPLY_RE.match(el)
              if m_gh:
                  candidates.append(m_gh.group(2).lower())
              cu = extract_cnb_user(el)
              if cu:
                  candidates.append(cu.lower())
          for link in sorted(ent["links"]):
              handle = link.rstrip("/").rsplit("/", 1)[-1].strip().lower()
              if handle:
                  candidates.append(handle)
          dname = sorted(ent["names"], key=name_sort_key)[0]
          candidates.append(re.sub(r"\s+", " ", dname.strip()).lower())
          for name in sorted(ent["names"]):
              candidates.append(re.sub(r"\s+", " ", name.strip()).lower())
          for cand in candidates:
              if cand in consent_map:
                  return consent_map[cand]
          return False


      def generate() -> str:
          if (
              subprocess.check_output(
                  ["git", "rev-parse", "--is-shallow-repository"], text=True
              ).strip()
              == "true"
          ):
              subprocess.run(["git", "fetch", "--unshallow", "--quiet"], check=False)

          fmt = "%H%x00%s%x00%an%x00%ae%x00%cn%x00%ce%x00%(trailers:key=Co-authored-by,valueonly,separator=%x1f)%x1e"
          raw = subprocess.check_output(
              ["git", "log", "HEAD", "--reverse", f"--format={fmt}"],
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          cnb_base = resolve_cnb_base()
          consent_map = load_consent_map()
          humans: dict[str, dict] = {}
          agents: dict[str, dict] = {}

          def record(name: str, email: str, role: str) -> None:
              name = name.strip()
              email = email.strip()
              if not name or not email or is_excluded_bot(name, email):
                  return
              agent_info = classify_agent(name, email)
              if agent_info:
                  cname, cemail, link = agent_info
                  ent = agents.setdefault(
                      cname,
                      {"name": cname, "email": cemail, "link": link, "roles": set()},
                  )
                  ent["roles"].add(role)
                  return
              key, link = human_identity(name, email, cnb_base)
              ent = humans.setdefault(
                  key, {"names": set(), "emails": set(), "links": set(), "roles": set()}
              )
              ent["names"].add(name)
              ent["emails"].add(email)
              if link:
                  ent["links"].add(link)
              ent["roles"].add(role)

          for rec in raw.split("\x1e"):
              rec = rec.strip("\r\n")
              if not rec:
                  continue
              parts = rec.split("\x00")
              if len(parts) < 7:
                  continue
              _sha, subject, an, ae, cn, ce, trailers = parts[:7]
              if subject.strip().startswith("chore(authors):"):
                  continue
              record(cn, ce, "Committer")
              record(an, ae, "Author")
              for t in trailers.split("\x1f"):
                  t = t.strip()
                  if not t:
                      continue
                  m = TRAILER_RE.match(t)
                  if m:
                      record(m.group(1), m.group(2), "Co-authored-by")

          merged: list[dict] = []
          for data in humans.values():
              matched = None
              for ex in merged:
                  if (ex["emails"] & data["emails"]) or (
                      {n.lower() for n in ex["names"]} & {n.lower() for n in data["names"]}
                  ):
                      matched = ex
                      break
              if matched is None:
                  merged.append(data)
              else:
                  matched["names"] |= data["names"]
                  matched["emails"] |= data["emails"]
                  matched["links"] |= data["links"]
                  matched["roles"] |= data["roles"]

          def fmt_human(ent: dict) -> tuple[tuple[int, str], str]:
              dname = sorted(ent["names"], key=name_sort_key)[0]
              emails = ", ".join(sorted(ent["emails"], key=email_sort_key))
              links = sorted(ent["links"])
              lpart = f" ({', '.join(links)})" if links else ""
              roles = [r for r in ROLE_ORDER if r in ent["roles"]]
              ctag = CONSENT_YES if resolve_human_consent(ent, consent_map) else CONSENT_NO
              owner = 0 if dname.lower() == "cybernova" else 1
              return ((owner, dname.lower()), f"- {dname} <{emails}>{lpart} [{', '.join(roles)}] {ctag}")

          h_lines = [l for _, l in sorted((fmt_human(e) for e in merged), key=lambda x: x[0])]
          a_lines = []
          for cname in sorted(agents.keys(), key=str.lower):
              ent = agents[cname]
              lpart = f" ({ent['link']})" if ent["link"] else ""
              roles = [r for r in ROLE_ORDER if r in ent["roles"]]
              a_lines.append(f"- {ent['name']} <{ent['email']}>{lpart} [{', '.join(roles)}]")

          return "\n".join([
              "# AUTHORS — 贡献者与署名清单",
              "#",
              "# 本文件由持续集成工作流在 Push 后依据当前完整 Git 提交历史自动生成与更新。",
              "# 仅保留当前完整历史中的有效贡献者，并将人类贡献者与 AI Agent 显著区分。",
              "# 人类贡献者的附加条款同意状态依据仓库根目录 meta.json (additionalTermsConsent) 判定；未覆盖者标记为“未明确同意”。",
              "",
              "## 人类贡献者 (Human Contributors)",
              "",
              *(h_lines if h_lines else ["- （无）"]),
              "",
              "## AI Agent 与辅助助手 (AI Agents)",
              "",
              *(a_lines if a_lines else ["- （无）"]),
              "",
          ])


      def norm(text: str) -> str:
          return text.replace("\r\n", "\n").rstrip("\n") + "\n" if text else ""


      def main() -> int:
          new_text = generate()
          new_hash = hashlib.sha256(new_text.encode("utf-8")).hexdigest()
          authors_path = Path("AUTHORS")
          existing = authors_path.read_text("utf-8") if authors_path.exists() else ""
          file_changed = existing != new_text

          if PLATFORM == "github":
              saved_hash = os.environ.get("SAVED_AUTHORS_HASH", "").strip()
              saved_snap = norm(os.environ.get("SAVED_AUTHORS_SNAPSHOT", ""))
              var_changed = (saved_hash != new_hash) or (saved_snap != new_text)
              print(f"AUTHORS SHA-256: {new_hash} (vars_hash={saved_hash or '<unset>'})")
              if not file_changed and not var_changed:
                  print("AUTHORS 与 GitHub Variables 均为最新，跳过提交（零噪音）。")
                  return 0
              if file_changed:
                  authors_path.write_text(new_text, encoding="utf-8", newline="\n")
                  subprocess.run(["git", "add", "AUTHORS"], check=True)
                  if subprocess.run(["git", "diff", "--cached", "--quiet", "--", "AUTHORS"]).returncode != 0:
                      subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
                      subprocess.run(
                          ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
                          check=True,
                      )
                      msg = (
                          "chore(authors): 自动同步 AUTHORS 贡献者清单 [skip ci]\n\n"
                          "文档: 依据当前完整 Git 提交历史自动更新 AUTHORS 贡献者清单。\n\n"
                          "[skip-hooks]\n"
                          "Generated-by: GitHub Actions\n"
                      )
                      subprocess.run(["git", "commit", "-m", msg], check=True)
                      branch = os.environ.get("GITHUB_REF_NAME", "main")
                      subprocess.run(["git", "push", "origin", f"HEAD:refs/heads/{branch}"], check=True)
                      print("已将更新后的 AUTHORS 推送至 GitHub。")
              if var_changed and os.environ.get("GH_TOKEN") and os.environ.get("GITHUB_REPOSITORY"):
                  repo_slug = os.environ["GITHUB_REPOSITORY"]
                  r1 = subprocess.run(
                      ["gh", "variable", "set", "AUTHORS_HASH", "-R", repo_slug, "--body", new_hash],
                      capture_output=True,
                      text=True,
                  )
                  r2 = subprocess.run(
                      ["gh", "variable", "set", "AUTHORS_SNAPSHOT", "-R", repo_slug, "--body", new_text],
                      capture_output=True,
                      text=True,
                  )
                  if r1.returncode == 0 and r2.returncode == 0:
                      print("已同步更新 GitHub Variables (AUTHORS_HASH / AUTHORS_SNAPSHOT)。")
                  else:
                      print("提示：当前令牌无权写入 Actions Variables，已依托仓库 AUTHORS 哈希对比跳过重复提交。")
          else:
              old_hash = hashlib.sha256(existing.encode("utf-8")).hexdigest() if existing else ""
              print(f"AUTHORS SHA-256: {new_hash} (existing={old_hash or '<none>'})")
              if old_hash == new_hash and not file_changed:
                  print("AUTHORS 哈希一致，跳过提交。")
                  return 0
              authors_path.write_text(new_text, encoding="utf-8", newline="\n")
              subprocess.run(["git", "add", "AUTHORS"], check=True)
              if subprocess.run(["git", "diff", "--cached", "--quiet", "--", "AUTHORS"]).returncode != 0:
                  subprocess.run(["git", "config", "user.name", "cnb"], check=True)
                  subprocess.run(["git", "config", "user.email", "noreply" + "@cnb." + "local"], check=True)
                  msg = (
                      "chore(authors): 自动同步 AUTHORS 贡献者清单 [skip ci]\n\n"
                      "文档: 依据当前完整 Git 提交历史自动更新 AUTHORS 贡献者清单。\n\n"
                      "[skip-hooks]\n"
                  )
                  subprocess.run(["git", "commit", "-m", msg], check=True)
                  base = resolve_cnb_base()
                  slug = os.environ.get("CNB_REPO_SLUG", "").strip()
                  user = os.environ.get("CNB_TOKEN_USER_NAME", "cnb").strip()
                  tok = os.environ.get("CNB_TOKEN", "").strip()
                  branch = os.environ.get("CNB_BRANCH", "main").strip()
                  if not (base and slug and tok):
                      raise RuntimeError("缺少 CNB 推送所需环境变量")
                  push_url = base.replace("://", f"://{user}:{tok}@", 1) + "/" + slug
                  subprocess.run(
                      ["git", "push", push_url, f"HEAD:refs/heads/{branch}", "-o", "ci.skip"],
                      check=True,
                  )
                  print("已将更新后的 AUTHORS 推送至镜像仓库。")
          return 0


      if __name__ == "__main__":
          raise SystemExit(main())
    PY

main:
  # ── 检查：main 推送时自动跑（唯一允许 push 触发的流水线）────────────────────
  push:
    - name: 检查 · test · build（dry-run，不发布）
      docker:
        image: node:22-bookworm
      # 后推的顶掉先推的：CI 只回答「现在的 main 好不好」，不给每个中间状态发成绩单。
      lock:
        key: checks-main
        wait: true
        cancel-in-progress: true
      stages:
        - name: 安装依赖
          script: pnpm install --frozen-lockfile
          timeout: 15m

        - name: 安装文档依赖
          script: pnpm --dir docs-site install --frozen-lockfile
          timeout: 15m

        - name: 文档依赖安全审计
          script: pnpm --dir docs-site audit --audit-level=moderate

        # 只查本次推送新增的提交，与 pre-push 钩子同一个语义：历史不翻旧账。
        # 拿不到 before（新建分支、手动触发、历史不可达）就跳过——护栏坏了让路。
        - name: 本次推送新增的提交信息
          script: |
            set -eu
            before="${CNB_BEFORE_SHA:-}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "拿不到 before（新建分支或手动触发），跳过"
              exit 0
            fi
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              git fetch --quiet origin "$before" 2>/dev/null || true
            fi
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "before=$before 在本地不可达，跳过"
              exit 0
            fi
            python3 tools/check-commit-messages.py "$before..$CNB_COMMIT"

        - name: pnpm run check（预算守卫 + 配置同步 + lint）
          script: pnpm run check

        - name: pnpm test
          script: pnpm test

        - name: pnpm run build（全量静态构建，dry-run）
          script: pnpm run build

        - name: 产物再过一遍守卫
          script: pnpm run check

        # 仓库 data/ 可能是空的（0 话时上面两步守不到「每话恰好一个 HTML」这类条目），
        # 所以再拿测试样本跑一遍整条流水线：manifest → db → 站点 → 索引 → sitemap → check。
        - name: 用测试样本全量空跑
          script: |
            export DATA_DIR=packages/core/test/fixtures/data
            export DIST_DIR="${CNB_BUILD_WORKSPACE:-$PWD}/fixture-dist"
            export OUT_DIR="${CNB_BUILD_WORKSPACE:-$PWD}/fixture-out"
            pnpm run build && pnpm run check

        # CI 能替代的只有前两级；platform / 流水线 / schema 的改动要人真跑过（CONTRIBUTING §二.3）。
        # 放在最后：只有前面的检查全过才走到这里（CNB 的 stages 失败会直接跳 failStages，
        # 没有 GitHub Actions 那种 always() 表达式——写 `if: always()` 会被当成 shell 命令而跳过）。
        - name: 分层验证提示
          script: |
            python3 tools/verification-tier.py "${CNB_BEFORE_SHA:-}" "$CNB_COMMIT" || true

        # - *sync-authors # 暂不启用 CNB 端自动写回，当前以 GitHub 端 AUTHORS 工作流为准

        # last-green 是稳定锚点：git checkout last-green 立刻回到最近一次全绿。
        # 只由 main 的 push 移动；手动检查不动它。
        - name: 移动 last-green
          if: '[ "$CNB_EVENT" = "push" ]'
          script: |
            set -eu
            base="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            repo_url="https://cnb:${CNB_TOKEN}@${base#*://}/${CNB_REPO_SLUG}"
            git push --force "$repo_url" "HEAD:refs/tags/last-green"
      failStages:
        - name: 记录失败详情
          script: |
            printf '%s\n' "失败阶段：${CNB_BUILD_FAILED_STAGE_NAME}" "失败原因：${CNB_BUILD_FAILED_MSG}" "构建日志：${CNB_BUILD_WEB_URL}"

        - name: 🔴 main 红灯
          script: |
            echo "🔴 main 红灯：检查流水线失败，这次推送没有移动 last-green。"
            echo "   红灯期间只允许修复类提交推 main（标题以 fix( / fix: / revert 开头，pre-push 闸门会拦）。"
            echo "   引入者负责修；修不了就 git revert 先恢复绿灯。规则：CONTRIBUTING.md §五。"
            echo "   构建日志：${CNB_BUILD_WEB_URL}"

  # ── 手动检查：与 push 同一套步骤，方便在页面上先跑一遍再推 ──────────────────
  web_trigger_check:
    - name: 手动检查 · test · build（dry-run，不发布）
      docker:
        image: node:22-bookworm
      lock:
        key: checks-manual
        wait: true
      stages:
        - name: 本次推送新增的提交信息
          script: |
            set -eu
            before="${CNB_BEFORE_SHA:-}"
            if [ -z "$before" ]; then
              echo "手动触发没有 before，跳过提交信息检查"
              exit 0
            fi
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              git fetch --quiet origin "$before" 2>/dev/null || true
            fi
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "before=$before 在本地不可达，跳过"
              exit 0
            fi
            python3 tools/check-commit-messages.py "$before..$CNB_COMMIT"

        - name: 安装依赖
          script: pnpm install --frozen-lockfile
          timeout: 15m

        - name: 安装文档依赖
          script: pnpm --dir docs-site install --frozen-lockfile
          timeout: 15m

        - name: 文档依赖安全审计
          script: pnpm --dir docs-site audit --audit-level=moderate

        - name: pnpm run check（预算守卫 + 配置同步 + lint）
          script: pnpm run check

        - name: pnpm test
          script: pnpm test

        - name: pnpm run build（全量静态构建，dry-run）
          script: pnpm run build

        - name: 产物再过一遍守卫
          script: pnpm run check

        - name: 用测试样本全量空跑
          script: |
            export DATA_DIR=packages/core/test/fixtures/data
            export DIST_DIR="${CNB_BUILD_WORKSPACE:-$PWD}/fixture-dist"
            export OUT_DIR="${CNB_BUILD_WORKSPACE:-$PWD}/fixture-out"
            pnpm run build && pnpm run check
      failStages:
        - name: 记录失败详情
          script: |
            printf '%s\n' "失败阶段：${CNB_BUILD_FAILED_STAGE_NAME}" "失败原因：${CNB_BUILD_FAILED_MSG}" "构建日志：${CNB_BUILD_WEB_URL}"

  # ── 发布：只手动（web_trigger_release），绝不接受 push 触发 ──────────────────
  web_trigger_release:
    - name: 发布（手动）
      docker:
        image: node:22-bookworm
      # 同一时间只跑一个发布，且不取消进行中的：发布做到一半被顶掉比等一会儿糟得多。
      lock:
        key: release
        wait: true
      stages:
        - name: 安装依赖
          script: pnpm install --frozen-lockfile
          timeout: 15m

        # 版本号进文件名与对象 key（gallery-<v>.sqlite、site-<v>.tar.zst），且带一年 immutable 缓存，
        # 所以同一版本号只能发布一次：缺省用「UTC 日期.构建号」，同一天再发也不会撞 key。
        - name: 发布参数与版本号
          script: |
            set -eu
            export DEPLOY_TARGET="${target:-none}"
            export DEPLOY_ENV="${deploy_env:-production}"
            v="${version:-$(date -u +%Y-%m-%d).$CNB_BUILD_ID}"
            RELEASE_VERSION="$v" pnpm run release:check -- --require-secret-imports
            started="$(date -u +%FT%TZ)"
            echo "版本 $v"
            echo "##[set-output version=$v]"
            echo "##[set-output started_at=$started]"
            echo "##[set-output deploy_target=$DEPLOY_TARGET]"
            echo "##[set-output deploy_environment=$DEPLOY_ENV]"
          exports:
            version: RELEASE_VERSION
            started_at: RELEASE_STARTED_AT
            deploy_target: DEPLOY_TARGET
            deploy_environment: DEPLOY_ENV

        - name: ingest:labelplus
          if: '[ -n "${chapters:-}" ]'
          script: |
            export CHAPTERS="$chapters"
            pnpm run ingest:labelplus

        - name: ingest:ocr（只补缺稿）
          if: '[ "${ocr:-false}" = "true" ]'
          script: |
            set -eu
            test -n "${chapters:-}" || { echo 'OCR 必须显式选择要识别的话'; exit 1; }
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
            export CHAPTERS="$chapters"
            ocr_result=0
            pnpm run ingest:ocr || ocr_result=$?
            mkdir -p out/ocr-review
            tar -czf "out/ocr-review-${RELEASE_VERSION}.tar.gz" -C out ocr-review
            echo "##[set-output exit_code=$ocr_result]"
          exports:
            exit_code: OCR_EXIT_CODE

        - name: 保存待校对台词附件
          if: '[ "${ocr:-false}" = "true" ]'
          image: cnbcool/attachments:latest
          settings:
            commit: $CNB_COMMIT
            attachments: 'out/ocr-review-*.tar.gz'

        - name: 核对 OCR 结果（失败前先保留已完成草稿）
          if: '[ "${ocr:-false}" = "true" ]'
          script: 'test "$OCR_EXIT_CODE" = "0"'

        - name: build（config → manifest → db → site → index → sitemap）
          script: pnpm run build

        - name: check（预算守卫）
          script: pnpm run check

        - name: dist 文件数（给 STATUS.md）
          script: echo "##[set-output dist_files=$(find dist -type f | wc -l)]"
          exports:
            dist_files: DIST_FILES

        # 归档用 tar --zstd，需要 zstd CLI；只在发布里装，检查流水线不背这个成本。
        - name: 归档工具（tar --zstd）
          script: |
            if command -v zstd >/dev/null 2>&1; then
              echo "zstd 已可用：$(zstd --version)"
              exit 0
            fi
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zstd

        # 图片清单核对单独一步：只有这一步拿得到存储凭据，astro build 等整条 build 都看不见 secret。
        # 缺图在这里就拦住，manifest.json 的当前版本指针不会指向引用了不存在图片的站点。
        - name: 核对对象存储里的图片清单
          imports: &publish_secrets ${publish_secrets_url}
          script: pnpm run verify:manifest

        - name: 准备发布基线
          imports: *publish_secrets
          script: pnpm run release:prepare

        # 写凭据只在这里出现，且只来自密钥仓库（铁律 7）。读永远走 CDN 域名。
        - name: publish:r2
          imports: *publish_secrets
          script: pnpm run publish:r2

        - name: deploy:cloudflare
          if: '[ "$DEPLOY_TARGET" = "cloudflare" ]'
          imports: &deploy_secrets ${deploy_secrets_url}
          script: pnpm run deploy:cloudflare

        # EdgeOne 用 ID 定位：EDGEONE_PROJECT_ID 填项目 ID（makers-…），EDGEONE_PROJECT_NAME 只作
        # CLI 的 -n 参数；部署前会按 ID 核对名字与同名唯一性（EdgeOne 允许多个同名项目）。
        # 首次部署先选 deploy_env=preview，核对 CLI 输出的项目名与 URL，再切 production。
        - name: deploy:edgeone
          if: '[ "$DEPLOY_TARGET" = "edgeone" ] || [ "$DEPLOY_TARGET" = "all" ]'
          imports: *deploy_secrets
          script: pnpm run deploy:edgeone

        - name: deploy:esa
          if: '[ "$DEPLOY_TARGET" = "esa" ] || [ "$DEPLOY_TARGET" = "all" ]'
          imports: *deploy_secrets
          script: pnpm run deploy:esa

        - name: deploy:workers
          if: '[ "$DEPLOY_TARGET" = "workers" ] || [ "$DEPLOY_TARGET" = "all" ]'
          imports: *deploy_secrets
          script: pnpm run deploy:workers

        # GitHub Pages 没有响应头、没有重定向、没有函数，是站点完整性的最小公分母（铁律 2）。
        # 流水线在这里校验 dist 基线，并用密钥仓库里的 GITHUB_PAGES_REPO / GITHUB_PAGES_TOKEN
        # 把 dist 推到该仓库的 gh-pages 分支；两者没配就是配置错误（见 scripts/deploy.mjs）。
        - name: deploy:github（校验基线 → 推 gh-pages）
          if: '[ "$DEPLOY_TARGET" = "github" ] || [ "$DEPLOY_TARGET" = "all" ]'
          imports: *deploy_secrets
          script: pnpm run deploy:github

        - name: 启用生产版本
          if: '[ "$DEPLOY_ENV" = "production" ] && [ "$DEPLOY_TARGET" != "none" ]'
          imports: *publish_secrets
          script: pnpm run release:activate

        - name: 写 STATUS.md
          if: '[ "$DEPLOY_ENV" = "production" ] && [ "$DEPLOY_TARGET" != "none" ]'
          imports: *publish_secrets
          # 版本、目标与环境统一由参数检查步骤经 exports 传入。
          script: pnpm run status

        # 页面已经上线（部署步骤全部在前）才通知搜索引擎：只推本次新增的页面
        # （release:prepare 存下的线上旧 manifest 与新 manifest 的差集）。只走 IndexNow：
        # key 在 site.config.yaml（协议要求公开放在站点根，build:sitemap 生成 key 文件），
        # 这一步不需要任何凭据，所以不 import 密钥仓库。不走百度；Google 没有普通页面的推送接口。
        # 失败单独标红、不判已完成的部署失败（allowFailure）。
        - name: 推送新页面给搜索引擎
          if: '[ "$DEPLOY_ENV" = "production" ] && [ "$DEPLOY_TARGET" != "none" ]'
          allowFailure: true
          script: |
            if [ "${push_all:-false}" = "true" ]; then
              pnpm run push:search -- --all
            else
              pnpm run push:search
            fi

        # 这是唯一允许由 CI 身份提交的东西（AGENTS.md §1 三）：ingest 写回的 data/text 与 STATUS.md。
        # 顶格独占一行的 [skip-hooks] 是记录在案的豁免——机器写的信息没有 Co-authored-by 可署。
        # 只在 stages 成功路径上执行；失败路径由 failStages 的「写回 data/text」兜住。
        - name: 提交 data/ 与 STATUS.md
          if: '[ "$DEPLOY_ENV" = "production" ] && [ "$DEPLOY_TARGET" != "none" ]'
          script: |
            set -eu
            # 提交身份跟随触发者：pre-receive 会核对提交者邮箱是不是已注册的 CNB 账号
            git config user.name "${CNB_BUILD_USER:-cnb}"
            git config user.email "${CNB_BUILD_USER_EMAIL:-cnb@cnb.cool}"
            git add STATUS.md data/text
            if git diff --cached --quiet; then
              echo '没有需要提交的变化'
              exit 0
            fi
            git commit -F - <<MSG
            chore(status): 发布 ${RELEASE_VERSION}（target=${target}）后自动更新 STATUS.md

            由 .cnb.yml 的发布流水线自动写入（CLAUDE.md 铁律 10）；同时写回本次 ingest 产出的 data/text。

            [skip-hooks]
            MSG
            base="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            repo_url="https://cnb:${CNB_TOKEN}@${base#*://}/${CNB_REPO_SLUG}"
            git remote set-url origin "$repo_url"
            git pull --rebase origin main
            git push origin HEAD:main
      failStages:
        - name: 记录失败详情
          script: |
            printf '%s\n' "失败阶段：${CNB_BUILD_FAILED_STAGE_NAME}" "失败原因：${CNB_BUILD_FAILED_MSG}" "构建日志：${CNB_BUILD_WEB_URL}"

        - name: 🔴 发布失败
          script: |
            echo "🔴 发布失败：请按失败阶段核对已部署的目标，部分站点可能已经更新。"
            echo "   页面绑定各自的检索库；生产指针仅在所有目标部署成功后的启用阶段更新。"
            echo "   若失败发生在启用之后，生产指针可能已更新，请同时核对发布状态。"
            echo "   构建日志：${CNB_BUILD_WEB_URL}"

        # 对应 GitHub Actions 时 always() 提交的那一半语义：稿已经 ingest 出来了，
        # 不能因为后面某一步失败就只留在构建容器里。提交失败不改变发布失败的状态。
        - name: 失败时也写回 ingest 产出的 data/text
          if: '[ "${DEPLOY_ENV:-preview}" = "production" ] && [ "${DEPLOY_TARGET:-none}" != "none" ]'
          script: |
            set -eu
            # 提交身份跟随触发者：pre-receive 会核对提交者邮箱是不是已注册的 CNB 账号
            git config user.name "${CNB_BUILD_USER:-cnb}"
            git config user.email "${CNB_BUILD_USER_EMAIL:-cnb@cnb.cool}"
            git add data/text
            if git diff --cached --quiet; then
              echo 'data/text 没有需要提交的变化'
              exit 0
            fi
            git commit -F - <<MSG
            chore(data): 发布中断时写回 ingest 产出的 data/text

            由 .cnb.yml 的发布流水线在失败路径上自动写回，避免稿只留在构建容器里。

            [skip-hooks]
            MSG
            base="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            repo_url="https://cnb:${CNB_TOKEN}@${base#*://}/${CNB_REPO_SLUG}"
            git remote set-url origin "$repo_url"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo '⚠ data/text 写回失败：稿仍在构建容器里，重新发布或手动取回'

  # ── 归档分支：只手动；先打 tag、核对成功，才删分支（AGENTS.md §0）──────────
  web_trigger_archive:
    - name: 🗄️ 归档分支为 tag
      docker:
        image: node:22-bookworm
      lock:
        key: archive
        wait: true
      stages:
        - name: 打 tag → 验证 → 删分支
          script: |
            set -eu
            branch="${branch:-}"
            case "$branch" in
              '') echo '✘ 必须填要归档的分支名'; exit 1;;
              main) echo '✘ 不能归档 main'; exit 1;;
              archive/*) echo '✘ 分支名不该以 archive/ 开头——那是 tag 的命名空间'; exit 1;;
            esac
            branch_ref="refs/heads/$branch"
            if ! git check-ref-format "$branch_ref"; then echo '✘ 分支名无效'; exit 1; fi
            base="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            repo_url="https://cnb:${CNB_TOKEN}@${base#*://}/${CNB_REPO_SLUG}"
            sha=$(git ls-remote --heads "$repo_url" "$branch_ref" | cut -f1)
            if [ -z "$sha" ]; then echo "✘ 远端没有分支 $branch"; exit 1; fi
            tag="archive/$branch"
            if git ls-remote --tags "$repo_url" "refs/tags/$tag" | grep -q .; then
              echo "✘ tag $tag 已存在（archive/* 不可变）；换个分支名或先人工核对"; exit 1
            fi
            # main 的浅克隆不一定含目标分支顶点；只获取精确分支，再核对没有读到竞争更新。
            git fetch --no-tags --depth=1 "$repo_url" "$branch_ref"
            fetched_sha=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
            if [ "$fetched_sha" != "$sha" ]; then
              echo '✘ 获取期间分支已变化，不创建归档标签或删除分支；请重新核对'; exit 1
            fi
            git push "$repo_url" "$sha:refs/tags/$tag"
            remote_tag=$(git ls-remote --tags "$repo_url" "refs/tags/$tag" | cut -f1)
            if [ "$remote_tag" != "$sha" ]; then
              echo "✘ tag 校验失败（远端 $remote_tag ≠ $sha），不删分支"; exit 1
            fi
            # 标签核对后分支仍可能更新；只删除本次已归档的精确顶点。
            git push --force-with-lease="$branch_ref:$sha" "$repo_url" ":$branch_ref"
            echo "## 已归档"
            echo
            echo "- 分支 \`$branch\` → tag \`$tag\`（\`$sha\`）"
            echo "- 分支已从远端删除；要找回：\`git checkout -b $branch $tag\`"
      failStages:
        - name: 记录失败详情
          script: |
            printf '%s\n' "失败阶段：${CNB_BUILD_FAILED_STAGE_NAME}" "失败原因：${CNB_BUILD_FAILED_MSG}" "构建日志：${CNB_BUILD_WEB_URL}"
