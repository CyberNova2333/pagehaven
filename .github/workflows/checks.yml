name: 检查

# 只在 main 上跑：本仓库直接提 main（AGENTS.md §0），分支不该存在，更不该拿来触发 CI（§2）。
# 这是唯一允许 push 触发的 workflow（CLAUDE.md 铁律 6）；npm run check 会守住这一点。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 后推的顶掉先推的：CI 是看「现在的 main 好不好」，不给每个中间状态发成绩单。
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 移动 last-green tag；红灯时在提交下留言

jobs:
  check:
    name: check · test · build（dry-run，不发布）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 提交信息检查与分层提示都要 before..after 这一段

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 只查本次推送新增的提交，与 pre-push 钩子同一个语义：历史不翻旧账。
      - name: 本次推送新增的提交信息
        run: |
          before='${{ github.event.before }}'
          after='${{ github.sha }}'
          case "$before" in
            ''|0000000000000000000000000000000000000000)
              echo "拿不到 before（新建分支或手动触发），跳过"; exit 0;;
          esac
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "before=$before 在本地不可达，跳过"; exit 0
          fi
          python3 tools/check-commit-messages.py "$before..$after"

      - name: npm run check（预算守卫 + 配置同步 + lint）
        run: npm run check

      - name: npm test
        run: npm test

      - name: npm run build（全量静态构建，dry-run）
        run: npm run build

      - name: 产物再过一遍守卫
        run: npm run check

      # 仓库 data/ 可能是空的（0 话时上面两步守不到「每话恰好一个 HTML」这类条目），
      # 所以再拿测试样本跑一遍整条流水线：manifest → db → 站点 → 索引 → sitemap → check。
      - name: 用测试样本全量空跑
        env:
          DATA_DIR: packages/core/test/fixtures/data
          DIST_DIR: ${{ runner.temp }}/fixture-dist
          OUT_DIR: ${{ runner.temp }}/fixture-out
        run: npm run build && npm run check

      # CI 能替代的只有前两级；platform / workflow / schema 的改动要人真跑过（CONTRIBUTING §二.3）
      - name: 分层验证提示
        if: always()
        run: python3 tools/verification-tier.py "${{ github.event.before }}" "${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      # last-green 是稳定锚点：git checkout last-green 立刻回到最近一次全绿
      - name: 移动 last-green
        if: success() && github.event_name == 'push'
        run: git push --force origin "HEAD:refs/tags/last-green"

      - name: 🔴 红灯标记
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: [
                '🔴 main 红灯：全量回归失败。',
                '',
                '红灯期间只允许修复主线的提交推 main（标题以 `fix(` / `fix:` / `revert` 开头，pre-push 会拦）。',
                '引入者负责修，修不了就 `git revert` 先恢复绿灯；找不到引入者用 `git bisect` 从 `last-green` 二分。',
                '规则：CONTRIBUTING.md §五「红灯协议」。运行：' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              ].join('\n'),
            });
