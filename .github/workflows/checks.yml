name: 检查

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checks-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    name: test · build（dry-run，不发布）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            docs-site/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15
      - name: 安装文档依赖
        run: pnpm --dir docs-site install --frozen-lockfile
        timeout-minutes: 15
      - name: 文档依赖安全审计
        run: pnpm --dir docs-site audit --audit-level=moderate
      - name: 本次推送新增的提交信息
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "拿不到 before（新建分支），跳过"
            exit 0
          fi
          if ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            git fetch --quiet origin "$PUSH_BEFORE" 2>/dev/null || true
          fi
          if ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            echo "before=$PUSH_BEFORE 在本地不可达，跳过"
            exit 0
          fi
          python3 tools/check-commit-messages.py "$PUSH_BEFORE..$GITHUB_SHA"
      - name: pnpm run check（预算守卫 + 配置同步 + lint）
        run: pnpm run check
      - name: pnpm test
        run: pnpm test
      - name: pnpm run build（全量静态构建，dry-run）
        run: pnpm run build
      - name: 产物再过一遍守卫
        run: pnpm run check
      - name: 用测试样本全量空跑
        run: |
          export DATA_DIR=packages/core/test/fixtures/data
          export DIST_DIR="$GITHUB_WORKSPACE/fixture-dist"
          export OUT_DIR="$GITHUB_WORKSPACE/fixture-out"
          pnpm run build && pnpm run check
      - name: 分层验证提示
        env:
          PUSH_BEFORE: ${{ github.event.before || '' }}
        run: python3 tools/verification-tier.py "$PUSH_BEFORE" "$GITHUB_SHA" || true
      - name: 校验 ASSETS_LICENSES.md（只读门禁）
        run: python3 .github/scripts/sync_assets_licenses.py github --check
      - name: 移动 last-green
        if: github.event_name == 'push'
        run: git push --force origin "HEAD:refs/tags/last-green"
      - name: 🔴 main 红灯
        if: failure()
        run: |
          echo "🔴 main 红灯：检查流水线失败，这次推送没有移动 last-green。"
          echo "红灯期间只允许修复类提交推 main；修不了就先 revert 恢复绿灯。"
