name: 文档站 GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs-site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: 安装文档依赖
        run: pnpm --dir docs-site install --frozen-lockfile
      - name: 构建文档站
        run: pnpm --dir docs-site run docs:build
      - uses: actions/configure-pages@v5
      - name: 核对并补充 Pages 文件
        run: |
          set -eu
          test -f docs-site/.vitepress/dist/index.html
          touch docs-site/.vitepress/dist/.nojekyll
          if [ -f docs-site/public/CNAME ]; then
            cp docs-site/public/CNAME docs-site/.vitepress/dist/CNAME
          fi
      - name: 发布静态产物到 docs-site 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cp -a docs-site/.vitepress/dist/. "$work/"
          git -C "$work" init -b docs-site
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add -A
          git -C "$work" commit -m "docs(docs-site): 构建并发布文档站静态产物 (${SOURCE_SHA:0:7})"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -C "$work" \
            -c "http.${SERVER_URL%/}/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --force "${SERVER_URL%/}/${REPO_SLUG}.git" docs-site:refs/heads/docs-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
