name: 发布

on:
  workflow_dispatch:
    inputs:
      chapters:
        description: 要导入或 OCR 的话；留空则不导入
        required: false
        type: string
        default: ''
      target:
        description: 部署目标；none 表示只上传
        required: true
        type: choice
        default: none
        options: [none, edgeone, esa, github, workers, cloudflare, all]
      deploy_env:
        description: 部署环境
        required: true
        type: choice
        default: production
        options: [production, preview]
      ocr:
        description: 对 chapters 只补 OCR 缺稿
        required: true
        type: boolean
        default: false
      version:
        description: 发布版本；留空使用 UTC 日期与运行 ID
        required: false
        type: string
        default: ''
      push_all:
        description: 搜索推送包含全部页面而非仅新增页面
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 手动发布
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: ${{ inputs.deploy_env }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 核对发布提交已通过检查
        run: |
          set -eu
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          green_sha=$(git ls-remote --exit-code origin refs/tags/last-green | cut -f1)
          test "$main_sha" = "$GITHUB_SHA" && test "$green_sha" = "$GITHUB_SHA" || { echo '发布必须使用当前 main 已通过检查的提交'; exit 1; }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15
      - name: 发布参数与版本号
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          DEPLOY_ENV: ${{ inputs.deploy_env }}
          INPUT_VERSION: ${{ inputs.version }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || secrets.R2_ENDPOINT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || secrets.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_PREVIEW_WORKER_NAME: ${{ vars.CLOUDFLARE_PREVIEW_WORKER_NAME || secrets.CLOUDFLARE_PREVIEW_WORKER_NAME }}
          WORKERS_DEPLOY_URL: ${{ vars.WORKERS_DEPLOY_URL || secrets.WORKERS_DEPLOY_URL }}
          WORKERS_PREVIEW_DEPLOY_URL: ${{ vars.WORKERS_PREVIEW_DEPLOY_URL || secrets.WORKERS_PREVIEW_DEPLOY_URL }}
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_ID: ${{ vars.EDGEONE_PROJECT_ID || secrets.EDGEONE_PROJECT_ID }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || secrets.EDGEONE_PROJECT_NAME }}
          EDGEONE_API_REGION: ${{ vars.EDGEONE_API_REGION || secrets.EDGEONE_API_REGION }}
          ESA_ACCESS_KEY_ID: ${{ secrets.ESA_ACCESS_KEY_ID }}
          ESA_ACCESS_KEY_SECRET: ${{ secrets.ESA_ACCESS_KEY_SECRET }}
          ESA_PROJECT_NAME: ${{ vars.ESA_PROJECT_NAME || secrets.ESA_PROJECT_NAME }}
          ESA_DEPLOY_URL: ${{ vars.ESA_DEPLOY_URL || secrets.ESA_DEPLOY_URL }}
          ESA_PREVIEW_IP: ${{ vars.ESA_PREVIEW_IP || secrets.ESA_PREVIEW_IP }}
          GITHUB_PAGES_REPO: ${{ vars.GITHUB_PAGES_REPO || secrets.GITHUB_PAGES_REPO || github.repository }}
          GITHUB_PAGES_TOKEN: ${{ secrets.GITHUB_PAGES_TOKEN || ((vars.GITHUB_PAGES_REPO || secrets.GITHUB_PAGES_REPO || github.repository) == github.repository && github.token || '') }}
          RELEASE_SIGNING_KEY_PRESENT: ${{ secrets.RELEASE_SIGNING_KEY != '' }}
        run: |
          set -eu
          v="${INPUT_VERSION:-$(date -u +%Y-%m-%d).$GITHUB_RUN_ID}"
          RELEASE_VERSION="$v" pnpm run release:check --require-secrets
          echo "版本 $v"
          {
            echo "RELEASE_VERSION=$v"
            echo "RELEASE_STARTED_AT=$(date -u +%FT%TZ)"
            echo "DEPLOY_TARGET=$DEPLOY_TARGET"
            echo "DEPLOY_ENV=$DEPLOY_ENV"
          } >> "$GITHUB_ENV"
      - name: ingest:labelplus
        id: ingest
        if: ${{ inputs.chapters != '' }}
        env:
          CHAPTERS: ${{ inputs.chapters }}
        run: pnpm run ingest:labelplus
      - name: ingest:ocr（只补缺稿）
        id: ocr
        if: ${{ inputs.ocr }}
        continue-on-error: true
        env:
          CHAPTERS: ${{ inputs.chapters }}
        run: |
          set -eu
          test -n "$CHAPTERS" || { echo 'OCR 必须显式选择要识别的话'; exit 1; }
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
          ocr_result=0
          pnpm run ingest:ocr || ocr_result=$?
          mkdir -p out/ocr-review
          tar -czf "out/ocr-review-${RELEASE_VERSION}.tar.gz" -C out ocr-review
          exit "$ocr_result"
      - name: 保存待校对台词附件
        if: ${{ inputs.ocr && always() && steps.ocr.outcome != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ocr-review-${{ env.RELEASE_VERSION || github.run_id }}
          path: out/ocr-review-*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: 核对 OCR 结果（失败前先保留已完成草稿）
        if: ${{ inputs.ocr }}
        env:
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
        run: test "$OCR_OUTCOME" = "success"
      - name: build（config → manifest → db → site → index → sitemap）
        run: pnpm run build
      - name: check（预算守卫）
        run: pnpm run check
      - name: dist 文件数（给 STATUS.md）
        run: echo "DIST_FILES=$(find dist -type f | wc -l)" >> "$GITHUB_ENV"
      - name: 归档工具（tar --zstd）
        run: |
          if command -v zstd >/dev/null 2>&1; then
            echo "zstd 已可用：$(zstd --version)"
            exit 0
          fi
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zstd
      - name: 核对对象存储里的图片清单
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || secrets.R2_ENDPOINT }}
        run: pnpm run verify:manifest
      - name: 准备发布基线
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || secrets.R2_ENDPOINT }}
        run: pnpm run release:prepare
      - name: publish:r2
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || secrets.R2_ENDPOINT }}
        run: pnpm run publish:r2
      - name: deploy:cloudflare
        if: ${{ env.DEPLOY_TARGET == 'cloudflare' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:cloudflare
      - name: deploy:edgeone
        if: ${{ env.DEPLOY_TARGET == 'edgeone' || env.DEPLOY_TARGET == 'all' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_ID: ${{ vars.EDGEONE_PROJECT_ID || secrets.EDGEONE_PROJECT_ID }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || secrets.EDGEONE_PROJECT_NAME }}
          EDGEONE_API_REGION: ${{ vars.EDGEONE_API_REGION || secrets.EDGEONE_API_REGION }}
        run: pnpm run deploy:edgeone
      - name: deploy:esa
        if: ${{ env.DEPLOY_TARGET == 'esa' || env.DEPLOY_TARGET == 'all' }}
        env:
          ESA_ACCESS_KEY_ID: ${{ secrets.ESA_ACCESS_KEY_ID }}
          ESA_ACCESS_KEY_SECRET: ${{ secrets.ESA_ACCESS_KEY_SECRET }}
          ESA_PROJECT_NAME: ${{ vars.ESA_PROJECT_NAME || secrets.ESA_PROJECT_NAME }}
          ESA_DEPLOY_URL: ${{ vars.ESA_DEPLOY_URL || secrets.ESA_DEPLOY_URL }}
          ESA_PREVIEW_IP: ${{ vars.ESA_PREVIEW_IP || secrets.ESA_PREVIEW_IP }}
        run: pnpm run deploy:esa
      - name: deploy:workers
        if: ${{ env.DEPLOY_TARGET == 'workers' || env.DEPLOY_TARGET == 'all' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || secrets.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_PREVIEW_WORKER_NAME: ${{ vars.CLOUDFLARE_PREVIEW_WORKER_NAME || secrets.CLOUDFLARE_PREVIEW_WORKER_NAME }}
          WORKERS_DEPLOY_URL: ${{ vars.WORKERS_DEPLOY_URL || secrets.WORKERS_DEPLOY_URL }}
          WORKERS_PREVIEW_DEPLOY_URL: ${{ vars.WORKERS_PREVIEW_DEPLOY_URL || secrets.WORKERS_PREVIEW_DEPLOY_URL }}
        run: pnpm run deploy:workers
      - name: deploy:github（校验基线 → 推 gh-pages）
        if: ${{ env.DEPLOY_TARGET == 'github' || env.DEPLOY_TARGET == 'all' }}
        env:
          GITHUB_PAGES_REPO: ${{ vars.GITHUB_PAGES_REPO || secrets.GITHUB_PAGES_REPO || github.repository }}
          GITHUB_PAGES_TOKEN: ${{ secrets.GITHUB_PAGES_TOKEN || ((vars.GITHUB_PAGES_REPO || secrets.GITHUB_PAGES_REPO || github.repository) == github.repository && github.token || '') }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: pnpm run deploy:github
      - name: 启用生产版本
        id: activate
        if: ${{ env.DEPLOY_ENV == 'production' && env.DEPLOY_TARGET != 'none' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || secrets.R2_ENDPOINT }}
        run: pnpm run release:activate
      - name: 写 STATUS.md
        id: status
        if: ${{ env.DEPLOY_ENV == 'production' && env.DEPLOY_TARGET != 'none' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || secrets.R2_ENDPOINT }}
        run: pnpm run status
      - name: 推送新页面给搜索引擎
        if: ${{ env.DEPLOY_ENV == 'production' && env.DEPLOY_TARGET != 'none' }}
        continue-on-error: true
        env:
          PUSH_ALL: ${{ inputs.push_all }}
        run: |
          if [ "$PUSH_ALL" = "true" ]; then
            pnpm run push:search -- --all
          else
            pnpm run push:search
          fi
      - name: 保全发布写回工件
        id: writeback_artifact
        if: ${{ always() && (steps.ingest.outcome == 'success' || steps.ingest.outcome == 'failure' || steps.status.outcome == 'success' || steps.status.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-writeback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/text
            STATUS.md
          if-no-files-found: error
          retention-days: 14
      - name: 签名写回本次发布改动
        if: ${{ always() && env.DEPLOY_ENV == 'production' && env.DEPLOY_TARGET != 'none' && steps.writeback_artifact.outcome == 'success' && (steps.ingest.outcome == 'success' || steps.ingest.outcome == 'failure' || steps.status.outcome == 'success') }}
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_ACTIVATED: ${{ steps.activate.outcome == 'success' }}
          WRITE_STATUS: ${{ steps.status.outcome == 'success' && steps.activate.outcome == 'success' }}
        run: |
          set -eu
          if [ "$WRITE_STATUS" = 'true' ]; then
            node scripts/ci/release-writeback.mjs status
          else
            node scripts/ci/release-writeback.mjs data
          fi
      - name: 🔴 发布失败
        if: failure()
        run: |
          echo '发布失败：请核对已经更新的目标与生产指针；写回工件可用于恢复导入台词及状态。'
