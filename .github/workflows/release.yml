name: 发布

# 只手动（CLAUDE.md 铁律 6）：没有 push、没有 tag、没有 schedule。
# 人类在手机上的 GitHub App 或网页里点 Run workflow；每一步都是 package.json 里的 script，
# 这个文件只是壳（ARCHITECTURE §5）——任何 CI 都能跑同一条流水线。
on:
  workflow_dispatch:
    inputs:
      chapters:
        description: '要 ingest 的话，逗号分隔的 <series>/<issue>/<chapter>；留空 = 只重建，不 ingest'
        required: false
        default: ''
      target:
        description: '部署目标'
        type: choice
        options: [none, cloudflare, edgeone, github, all]
        default: none
      ocr:
        description: '缺稿的话跑 OCR（只补没有 LabelPlus 稿的）'
        type: boolean
        default: false
      deploy_env:
        description: '发到生产还是预览（平台层改动先 preview 一次，CONTRIBUTING §二.3）'
        type: choice
        options: [production, preview]
        default: production
      version:
        description: '版本号；留空 = <UTC 日期>.<运行序号>。同一版本号只发布一次（版本化 key 一年不可变）'
        required: false
        default: ''

# 同一时间只跑一个发布，且不取消进行中的：发布做到一半被顶掉比等一会儿糟得多。
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # 写回 data/ 与 STATUS.md
  pages: write      # GitHub Pages
  id-token: write   # actions/deploy-pages 需要

jobs:
  build:
    name: ingest → build → check → publish → deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      started_at: ${{ steps.version.outputs.started_at }}
      dist_files: ${{ steps.count.outputs.dist_files }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 版本号进文件名与对象 key（gallery-<v>.sqlite、site-<v>.tar.zst），且带一年 immutable 缓存，
      # 所以同一版本号只能发布一次：缺省用「日期.运行序号」，同一天再发也不会撞 key。
      - name: 版本号
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-$(date -u +%Y-%m-%d).${{ github.run_number }}}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          echo "版本 $v"

      - name: ingest:labelplus
        if: inputs.chapters != ''
        env:
          CHAPTERS: ${{ inputs.chapters }}
        run: npm run ingest:labelplus

      - uses: actions/setup-python@v5
        if: inputs.ocr
        with:
          python-version: '3.12'

      - name: ingest:ocr（只补缺稿）
        if: inputs.ocr
        env:
          CHAPTERS: ${{ inputs.chapters }}
        run: npm run ingest:ocr

      - name: build（config → manifest → db → site → index → sitemap）
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      - name: check（预算守卫）
        run: npm run check

      - name: dist 文件数（给 STATUS.md）
        id: count
        run: echo "dist_files=$(find dist -type f | wc -l)" >> "$GITHUB_OUTPUT"

      # 图片清单核对单独一步：只有这一步拿得到存储凭据，astro build 等整条 build 都看不见 secret。
      # 缺图在这里就拦住，manifest.json 的当前版本指针不会指向引用了不存在图片的站点。
      - name: 核对对象存储里的图片清单
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: npm run verify:manifest

      # 写凭据只在这里出现，且只来自 secrets（铁律 7）。读永远走 CDN 域名。
      - name: publish:r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run publish:r2

      - name: deploy:cloudflare
        if: inputs.target == 'cloudflare' || inputs.target == 'all'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ inputs.deploy_env }}
        run: npm run deploy:cloudflare

      # EDGEONE_PROJECT_ID 的值是 Makers 的「项目名」（CLI 的 -n 语义：不存在就新建，填错不报错）。
      # 首次部署先选 deploy_env=preview，核对 CLI 输出的项目名与 URL，再切 production。
      - name: deploy:edgeone
        if: inputs.target == 'edgeone' || inputs.target == 'all'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_ID: ${{ secrets.EDGEONE_PROJECT_ID }}
          DEPLOY_ENV: ${{ inputs.deploy_env }}
        run: npm run deploy:edgeone

      - name: deploy:github（校验基线文件；真正上传在下一个 job）
        if: inputs.target == 'github' || inputs.target == 'all'
        run: npm run deploy:github

      - uses: actions/upload-pages-artifact@v3
        if: inputs.target == 'github' || inputs.target == 'all'
        with:
          path: dist

      # 产物只进对象存储与 Artifacts，不进仓库（CONTRIBUTING §四）
      - uses: actions/upload-artifact@v4
        with:
          name: release-out
          path: |
            out/
            data/text/
          if-no-files-found: ignore
          retention-days: 14

  pages:
    name: GitHub Pages
    if: inputs.target == 'github' || inputs.target == 'all'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  status:
    name: 写 STATUS.md
    # build 成功就写；pages 被跳过（目标不是 github）不算失败
    if: always() && needs.build.result == 'success' && needs.pages.result != 'failure'
    needs: [build, pages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: release-out
          path: .

      - name: 写 STATUS.md
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_STARTED_AT: ${{ needs.build.outputs.started_at }}
          DIST_FILES: ${{ needs.build.outputs.dist_files }}
          DEPLOY_TARGET: ${{ inputs.target }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: npm run status

      # 这是唯一允许由 CI 身份提交的东西（AGENTS.md §1 三）：ingest 写回的 data/text 与 STATUS.md。
      # 顶格独占一行的 [skip-hooks] 是记录在案的豁免——机器写的信息没有 Co-authored-by 可署。
      # 上一步列举对象存储失败时也已经把 STATUS.md 写好（那一格记「列出失败」），照样提交：
      # 本次 ingest 写回的 data/text 不能因为一次列举失败就只留在 14 天过期的 artifact 里。
      - name: 提交 data/ 与 STATUS.md
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md data/text
          if git diff --cached --quiet; then
            echo '没有需要提交的变化'; exit 0
          fi
          git commit -F - <<'MSG'
          chore(status): 发布 ${{ needs.build.outputs.version }}（target=${{ inputs.target }}）后自动更新 STATUS.md

          由 release.yml 自动写入（CLAUDE.md 铁律 10）；同时写回本次 ingest 产出的 data/text。

          [skip-hooks]
          MSG
          git pull --rebase origin main
          git push origin HEAD:main
