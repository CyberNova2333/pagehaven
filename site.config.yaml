# site.config.yaml —— 唯一配置源（CLAUDE.md 铁律 5）
#
# 域名、缓存、响应头、重定向、功能开关只在这里改。
# 响应配置与 wrangler.jsonc / esa.jsonc 部署模板由 `pnpm run build:config` 生成到
# packages/platform/generated/，不手改；`pnpm run check` 会比对生成物与本文件是否同步。
# 字段的含义与取值约束见 packages/platform/src/site-config.js（zod schema）。

site:
  title: 页间 · Pagehaven
  # 站点域名（不含协议）；正式发布前替换示例值。切换托管平台只改 DNS 的 CNAME。
  domain: gallery.example.org
  lang: zh-CN

images:
  # 图片 CDN 域名；正式发布前替换示例值，并配置对象存储私有回源。
  # 浏览器只见 CDN 域名，不直连存储（铁律 7）；换 CDN 只改这里。
  hosts:
    - images.example.org
  # 对象存储内图片 key 的前缀
  prefix: img/

db:
  # 检索库 sqlite 的 page_size；必须与 search.request_chunk_size 相等（check 守卫）
  page_size: 4096
  # 取块层对齐块大小 = page_size × 16；逐块 sha256 也按它切（ARCHITECTURE §6）
  chunk_size: 65536
  # 对象存储内 DB 的 key 前缀；带日期的版本化 key 见 ARCHITECTURE §4
  prefix: db/
  # 当前整库下载的硬上限；Range VFS 接入前超出此值不加载
  whole_download_max_bytes: 31457280

search:
  # 浏览器端 VFS 每次 Range 请求的块大小；必须等于 db.page_size
  request_chunk_size: 4096
  # trigram：≥ 3 字走 MATCH；恰好 2 字走 LIKE；1 字拒绝
  min_match_length: 3
  # 预留给函数版检索的探测路径（尚未接通；当前始终在浏览器检索）
  api_path: /api/search

features:
  # 牵一发动全身的功能默认关；打开动作本身是一个独立 commit（CONTRIBUTING §三）。
  # flag 只能让站点退回更保守的形态，不能关掉 pnpm run check 里的任何守卫。
  search_function: false   # 部署 Hono 函数加速检索
  platform_config: true    # 把 _headers/_redirects/edgeone.json 放进 dist（关掉 = 纯静态基线）
  text_layer: true         # 阅读器叠可选中的文字层
  comimi_reader: false     # 允许用户选择增强分页；加载失败回退现有阅读器

budgets:
  # 数字的来历见 docs/ARCHITECTURE.md §2「预算」
  max_files: 18000
  max_file_bytes: 20971520

# 托管平台响应头（Cloudflare _headers / EdgeOne edgeone.json）。
# GitHub Pages 没有响应头（铁律 2），所以这里每一条都只能是锦上添花，不能是必需。
headers:
  - path: /*
    headers:
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin
  - path: /index/*
    headers:
      Cache-Control: public, max-age=300
  - path: /sitemap.xml
    headers:
      Content-Type: application/xml; charset=utf-8

# 重定向：Cloudflare _redirects / EdgeOne redirects；GitHub Pages 用
# <meta http-equiv="refresh"> 页面兜底（build:site 生成）。
# - from: /old/path
#   to: /new/path
#   status: 301
redirects: []

seo:
  # 主动向搜索引擎推送新页面（pnpm run push:search，发布流水线部署之后跑）。
  # IndexNow key：协议要求公开放在 https://<domain>/<key>.txt（build:sitemap 自动生成），
  # 所以它不是凭据、可以写在这里；留空 = 不推 IndexNow。只走 IndexNow，不走百度；
  # Google 没有普通页面的推送接口，靠 robots.txt 的 Sitemap。
  indexnow_key: ""

deploy:
  cloudflare:
    # Pages 项目名（不是账号 ID；账号 ID 与 token 在 secrets）
    project: pagehaven
  edgeone:
    # EDGEONE_PROJECT_ID 与 EDGEONE_PROJECT_NAME 分别在 secrets；这里只放部署形态
    functions_dir: edge-functions
  github:
    # 写 CNAME 文件（内容 = site.domain）与 .nojekyll
    cname: true
  workers:
    # 静态资源使用此兼容日期；生产/预览 Worker 名称由 secrets 分别指定。
    compatibility_date: '2026-11-02'
  # ESA 项目标识和访问凭据只在 secrets；静态部署不配置函数入口。
  esa: {}
